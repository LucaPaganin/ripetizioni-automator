name: Sync appunti e pubblica sito

on:
  schedule:
    - cron: "17 21 * * *" # ogni sera ~22:17 ora italiana (UTC+1)
  workflow_dispatch:
    inputs:
      max_files:
        description: "PDF massimi da elaborare"
        default: "15"
  push:
    branches: [main]
    paths-ignore: ["docs/**", "pipeline/state.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Trascrivi PDF nuovi
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_ROOT_ID: ${{ vars.DRIVE_ROOT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_FILES: ${{ inputs.max_files || '15' }}
        run: python pipeline/sync.py

      - name: Commit
        run: |
          git config user.name "ripetizioni-bot"
          git config user.email "ripetizioni-bot@users.noreply.github.com"
          git add docs pipeline/state.json
          git diff --cached --quiet || git commit -m "Appunti: sync $(date -u +%F)"
          git push

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
