name: Sync appunti e pubblica sito

on:
  schedule:
    - cron: "17 21 * * *" # ogni sera ~22:17 ora italiana (UTC+1)
  workflow_dispatch:
    inputs:
      max_files:
        description: "PDF massimi da elaborare"
        default: "15"
  push:
    branches: [main]
    paths-ignore: ["docs/**", "pipeline/state.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # KaTeX per validare le formule trascritte (stesso motore del sito).
      - run: npm ci --prefix pipeline --no-audit --no-fund

      # Credenziali GCP a vita breve via OIDC (Workload Identity Federation): nessuna chiave JSON.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Trascrivi PDF nuovi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_ROOT_ID: ${{ vars.DRIVE_ROOT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_FILES: ${{ inputs.max_files || '15' }}
          PYTHONUNBUFFERED: "1" # progresso visibile in tempo reale nei log
        run: python pipeline/sync.py

      - name: Commit
        run: |
          git config user.name "ripetizioni-bot"
          git config user.email "ripetizioni-bot@users.noreply.github.com"
          git add docs pipeline/state.json
          git diff --cached --quiet || git commit -m "Appunti: sync $(date -u +%F)"
          # Il run dura minuti: se nel frattempo qualcuno ha pushato sul branch,
          # riallinea (il bot tocca solo docs/ e state.json) e riprova.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
