site_name: Ripetizioni
theme:
  name: material
  language: it
  features:
    - navigation.indexes
    - navigation.sections
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Tema scuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Tema chiaro }

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details

hooks:
  - hooks/math.py

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/math.css
